<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PixelLight — Minecraftuuuum!</title>
  <link rel="stylesheet" href="/ucc.css" />
</head>
<body>
  <nav class="nav">
    <a href="/library">Servers</a>
    <a href="/lemma-library">Lemmas</a>
    <a href="/lemma-implementation">Implement</a>
    <a href="/block-recipes">Blocks / recipes</a>
    <a href="/video-generation">Video generation</a>
    <a href="/pixellight">PixelLight</a>
  </nav>
  <main>
    <h1>Web PixelLight converter</h1>
    <p>Upload a still. Runs three folds, stores addresses, converts for Minecraft faces.</p>
    <form id="form">
      <input type="file" name="file" accept="image/*" required />
      <input name="artworkId" placeholder="artwork id" value="demo" />
      <select name="face">
        <option>north</option><option>south</option><option>east</option>
        <option>west</option><option>up</option><option>down</option>
      </select>
      <button>Ingest</button>
    </form>
    <h2>Screenshot (no clone)</h2>
    <p class="wa-meta">Stores one face, then extrapolates neighbors from common points.</p>
    <form id="iso-form">
      <input type="file" name="image" accept="image/*" required />
      <input name="artworkId" placeholder="artwork id" value="demo" />
      <select name="face">
        <option>north</option><option>south</option><option>east</option>
        <option>west</option><option>up</option><option>down</option>
      </select>
      <button>Store screenshot</button>
    </form>
    <p>
      <button type="button" id="iso-extra">Extrapolate</button>
      <button type="button" id="iso-join">Join 2D → 3D</button>
    </p>
    <div id="comp"></div>
    <pre id="out"></pre>
  </main>
  <script src="/components/voxel-ingest.js"></script>
  <script>
    document.getElementById("form").onsubmit = async (ev) => {
      ev.preventDefault();
      const fd = new FormData(ev.target);
      const ingest = await fetch("/api/voxel/ingest", { method: "POST", body: fd });
      const folds = await fetch("/api/voxel/folds", { method: "POST", body: fd });
      const art = fd.get("artworkId");
      const conv = await fetch("/api/voxel/pixellight?artworkId=" + encodeURIComponent(art));
      document.getElementById("out").textContent = JSON.stringify({
        ingest: await ingest.json(),
        folds: await folds.json(),
        pixellight: await conv.json(),
      }, null, 2);
      const file = ev.target.file.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        VoxelIngest.mount(document.getElementById("comp"), {
          artworkId: art, face: fd.get("face"), imageUrl: url,
        });
      }
    };
    document.getElementById("iso-form").onsubmit = async (ev) => {
      ev.preventDefault();
      const fd = new FormData(ev.target);
      const rec = await fetch("/api/iso/screenshots", { method: "POST", body: fd }).then((r) => r.json());
      document.getElementById("out").textContent = JSON.stringify(rec, null, 2);
    };
    document.getElementById("iso-extra").onclick = async () => {
      const art = document.querySelector("#iso-form [name=artworkId]").value;
      const rec = await fetch("/api/iso/extrapolate", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ artworkId: art })
      }).then((r) => r.json());
      document.getElementById("out").textContent = JSON.stringify(rec, null, 2);
    };
    document.getElementById("iso-join").onclick = async () => {
      const art = document.querySelector("#iso-form [name=artworkId]").value;
      const rec = await fetch("/api/iso/join", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ artworkId: art })
      }).then((r) => r.json());
      document.getElementById("out").textContent = JSON.stringify(rec, null, 2);
    };
  </script>
  <script src="/shared/cave-shell.js"></script>
</body>
</html>
